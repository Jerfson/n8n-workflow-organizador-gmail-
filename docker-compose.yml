services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-organizador-gmail
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n_secret_key_change_me_in_production}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${TZ:-America/Sao_Paulo}
      - ALERT_EMAIL=${ALERT_EMAIL:-seu-email@gmail.com}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/data/workflows:ro

volumes:
  n8n_data:
    name: n8n_data_organizador
